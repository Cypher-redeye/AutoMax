databases:
  - name: automax-db
    databaseName: automax
    user: automax_user
    plan: free

services:
  - type: web
    name: automax
    env: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn automax.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: DATABASE_URL
        fromDatabase:
          name: automax-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
